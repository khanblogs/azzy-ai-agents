name: ci

# AZZY AI AGENTS v2.0 — web checks, api tests, e2e against the compose stack, SSM deploy on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  web:
    name: web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO: "1"

  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Unit tests (policy/guard/orchestrator) run with DEMO=1 and no network;
    # the services are there for any test that opens a real connection.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: azzy
          POSTGRES_PASSWORD: azzy
          POSTGRES_DB: azzy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U azzy -d azzy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Test
        working-directory: apps/api
        env:
          DEMO: "1"
          AGENTS_DIR: ${{ github.workspace }}/packages/agents
          JWT_SECRET: ci-only-secret
          OWNER_EMAIL: owner@azzy.local
          OWNER_PASSWORD: change-me-now
          WEBHOOK_SECRET: ci-only-webhook
          DATABASE_URL: postgresql+asyncpg://azzy:azzy@localhost:5432/azzy
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  e2e:
    name: e2e (playwright against compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare env
        run: cp infra/.env.example infra/.env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and start the stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost/healthz >/dev/null; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 3
          done
          echo "stack did not become healthy"
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs --tail=200
          exit 1
      - name: Migrations smoke (alembic current == head)
        run: |
          set -euo pipefail
          current=$(docker compose -f infra/docker-compose.yml exec -T api alembic current 2>/dev/null | tr -d '\r')
          echo "alembic current: ${current}"
          echo "${current}" | grep -q "(head)" || { echo "database is not at alembic head"; exit 1; }
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost
          OWNER_EMAIL: owner@azzy.local
          OWNER_PASSWORD: change-me-now
        run: npm run e2e
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=500 > compose.log 2>&1 || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots
          retention-days: 14
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans || true

  deploy:
    name: deploy (SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, api, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check deploy configuration
        id: cfg
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$INSTANCE" ]; then
            echo "AWS_ROLE_TO_ASSUME / EC2_INSTANCE_ID not configured; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Deploy via SSM
        if: steps.cfg.outputs.enabled == 'true'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          cmd_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "azzy-ai-agents deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters 'commands=["cd /opt/azzy-ai-agents && bash infra/scripts/deploy.sh main"],executionTimeout=["900"]' \
            --query "Command.CommandId" --output text)
          echo "command id: $cmd_id"
          status=Pending
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
                      --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 5
          done
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text || true
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text || true
          [ "$status" = "Success" ] || { echo "deploy status: $status"; exit 1; }

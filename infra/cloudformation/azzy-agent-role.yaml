AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AZZY AI AGENTS v2.0 - cross-account role for a CLIENT/workload AWS account.
  One template, three scopes: ReadOnly (AzzyReadOnlyRole), Audit (AzzyAuditRole),
  Deploy (AzzyDeploymentRole). The Azzy HQ account assumes the role with STS
  AssumeRole + ExternalId. IAM writes, data-plane reads and destructive actions
  are explicitly denied in every scope. Never grants AdministratorAccess.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Azzy HQ" }
        Parameters: [AzzyAccountId, ExternalId]
      - Label: { default: "Role" }
        Parameters: [Scope, RoleName, MaxSessionDuration]
    ParameterLabels:
      AzzyAccountId: { default: "Azzy HQ AWS account id" }
      ExternalId: { default: "External id (shared secret from the onboarding wizard)" }
      Scope: { default: "Permission scope" }
      RoleName: { default: "Role name (blank = default for the scope)" }

Parameters:
  AzzyAccountId:
    Type: String
    Description: 12-digit AWS account id of the AZZY HQ (Terraform output account_id; shown in the wizard).
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: must be a 12-digit AWS account id
  ExternalId:
    Type: String
    Description: Random string generated by the wizard (or openssl rand -hex 16). Enter the same value in the Azzy UI.
    MinLength: 8
    MaxLength: 1224
    AllowedPattern: "^[A-Za-z0-9+=,.@:/_-]+$"
    NoEcho: true
  Scope:
    Type: String
    Default: ReadOnly
    AllowedValues: [ReadOnly, Audit, Deploy]
    Description: >-
      ReadOnly = describe / logs / cost reads. Audit = ReadOnly + IAM credential reports, Config,
      Security Hub, GuardDuty, Access Analyzer, CloudTrail lookups. Deploy = Audit + ECS service
      updates, Lambda code updates, instance refresh and SSM commands on instances tagged azzy:managed=true.
  RoleName:
    Type: String
    Default: ""
    Description: >-
      Leave blank to use the scope default (AzzyReadOnlyRole / AzzyAuditRole / AzzyDeploymentRole).
      The HQ instance policy only allows assuming those three names.
    AllowedPattern: "^([A-Za-z0-9+=,.@_-]{1,64})?$"
  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Max AssumeRole session length in seconds.

Mappings:
  ScopeDefaults:
    ReadOnly:
      RoleName: AzzyReadOnlyRole
      Description: AZZY AI AGENTS read-only access (describe, logs, cost)
    Audit:
      RoleName: AzzyAuditRole
      Description: AZZY AI AGENTS security audit access (read-only + IAM/Config/SecurityHub/GuardDuty/CloudTrail reads)
    Deploy:
      RoleName: AzzyDeploymentRole
      Description: AZZY AI AGENTS deployment access (audit + ECS/Lambda/SSM controlled writes)

Conditions:
  UseDefaultRoleName: !Equals [!Ref RoleName, ""]
  IsAudit: !Equals [!Ref Scope, Audit]
  IsDeploy: !Equals [!Ref Scope, Deploy]
  IsAuditOrDeploy: !Or [!Condition IsAudit, !Condition IsDeploy]

Resources:
  AzzyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - UseDefaultRoleName
        - !FindInMap [ScopeDefaults, !Ref Scope, RoleName]
        - !Ref RoleName
      Description: !FindInMap [ScopeDefaults, !Ref Scope, Description]
      MaxSessionDuration: !Ref MaxSessionDuration
      Tags:
        - Key: azzy:scope
          Value: !Ref Scope
        - Key: azzy:managed-by
          Value: azzy-ai-agents
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AzzyHQAssume
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AzzyAccountId}:root"
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: AzzyReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeCompute
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:GetConsoleOutput
                  - autoscaling:Describe*
                  - elasticloadbalancing:Describe*
                  - ecs:Describe*
                  - ecs:List*
                  - ecr:Describe*
                  - ecr:List*
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - eks:Describe*
                  - eks:List*
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions
                  - lambda:ListVersionsByFunction
                  - lambda:ListAliases
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - elasticache:Describe*
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketVersioning
                  - cloudfront:List*
                  - cloudfront:Get*
                  - wafv2:List*
                  - wafv2:Get*
                  - route53:List*
                  - route53:Get*
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - ssm:ListCommands
                  - ssm:ListCommandInvocations
                  - tag:GetResources
                  - resource-groups:ListGroupResources
                  - cloudformation:Describe*
                  - cloudformation:List*
                  - cloudformation:GetTemplateSummary
                  - health:Describe*
                  - sts:GetCallerIdentity
                  - iam:SimulatePrincipalPolicy
                Resource: "*"
              - Sid: CloudWatchRead
                Effect: Allow
                Action:
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:DescribeMetricFilters
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:GetQueryResults
                  - logs:TestMetricFilter
                Resource: "*"
              - Sid: CostRead
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags
                  - budgets:ViewBudget
                Resource: "*"
              - Sid: DenyDangerous
                Effect: Deny
                Action:
                  - iam:Create*
                  - iam:Put*
                  - iam:Attach*
                  - iam:Detach*
                  - iam:Delete*
                  - iam:Update*
                  - iam:Add*
                  - iam:Remove*
                  - iam:Tag*
                  - iam:Untag*
                  - iam:ChangePassword
                  - iam:SetDefaultPolicyVersion
                  - organizations:*
                  - account:*
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteBucket
                  - rds:Delete*
                  - rds:Modify*
                  - ec2:TerminateInstances
                  - ec2:DeleteVolume
                  - ec2:DeleteSnapshot
                  - eks:DeleteCluster
                  - ecs:DeleteCluster
                  - kms:Decrypt
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"

  AzzyAuditPolicy:
    Type: AWS::IAM::Policy
    Condition: IsAuditOrDeploy
    Properties:
      PolicyName: AzzyAudit
      Roles: [!Ref AzzyRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IamPostureRead
            Effect: Allow
            Action:
              - iam:GetAccountAuthorizationDetails
              - iam:GenerateCredentialReport
              - iam:GetCredentialReport
              - iam:GetAccountSummary
              - iam:GetAccountPasswordPolicy
              - iam:List*
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetUser
              - iam:GetUserPolicy
            Resource: "*"
          - Sid: SecurityServicesRead
            Effect: Allow
            Action:
              - config:Describe*
              - config:Get*
              - config:List*
              - securityhub:Get*
              - securityhub:List*
              - securityhub:Describe*
              - guardduty:Get*
              - guardduty:List*
              - access-analyzer:List*
              - access-analyzer:Get*
              - inspector2:List*
              - inspector2:BatchGet*
              - cloudtrail:LookupEvents
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
              - cloudtrail:GetEventSelectors
              - kms:ListKeys
              - kms:ListAliases
              - kms:DescribeKey
              - kms:GetKeyRotationStatus
              - ecr:DescribeImageScanFindings
            Resource: "*"

  AzzyDeployPolicy:
    Type: AWS::IAM::Policy
    Condition: IsDeploy
    Properties:
      PolicyName: AzzyDeploy
      Roles: [!Ref AzzyRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcsRollouts
            Effect: Allow
            Action:
              - ecs:UpdateService
              - ecs:RegisterTaskDefinition
              - ecs:DeregisterTaskDefinition
              - ecs:TagResource
            Resource: "*"
          - Sid: EcsPassTaskRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Sid: EcrPush
            Effect: Allow
            Action:
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:BatchCheckLayerAvailability
            Resource: !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/*"
          - Sid: EksReadForRollouts
            Effect: Allow
            Action:
              - eks:DescribeCluster
              - eks:DescribeNodegroup
              - eks:DescribeUpdate
              - eks:ListClusters
              - eks:ListNodegroups
              - eks:ListUpdates
              - eks:AccessKubernetesApi
            Resource: "*"
          - Sid: LambdaCode
            Effect: Allow
            Action:
              - lambda:UpdateFunctionCode
              - lambda:PublishVersion
              - lambda:UpdateAlias
            Resource: !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:*"
          - Sid: SsmRunOnManagedInstances
            Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub "arn:aws:ec2:*:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                ssm:resourceTag/azzy:managed: "true"
          - Sid: SsmAllowedDocuments
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - arn:aws:ssm:*:*:document/AWS-RunShellScript
              - arn:aws:ssm:*:*:document/AWS-RunPatchBaseline
          - Sid: SsmCommandResults
            Effect: Allow
            Action:
              - ssm:GetCommandInvocation
              - ssm:ListCommandInvocations
              - ssm:CancelCommand
            Resource: "*"
          - Sid: AutoScalingRollouts
            Effect: Allow
            Action:
              - autoscaling:StartInstanceRefresh
              - autoscaling:CancelInstanceRefresh
              - autoscaling:DescribeInstanceRefreshes
            Resource: "*"

Outputs:
  RoleArn:
    Description: Paste into the Azzy onboarding wizard (step 3) together with the ExternalId.
    Value: !GetAtt AzzyRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"
  RoleName:
    Description: Role name created.
    Value: !Ref AzzyRole
  ScopeApplied:
    Description: Permission scope granted (readonly | audit | deploy as the wizard expects it).
    Value: !Ref Scope
  WizardJson:
    Description: Exact JSON body for POST /api/aws-accounts (fill name, regions, stage; external_id is the value you entered).
    Value: !Sub
      - '{"name": "<display name>", "account_id": "${AWS::AccountId}", "role_arn": "${Arn}", "external_id": "<the ExternalId you entered>", "scope": "${ScopeLower}", "regions": ["${AWS::Region}"], "stage": "dev"}'
      - Arn: !GetAtt AzzyRole.Arn
        ScopeLower: !If [IsDeploy, deploy, !If [IsAudit, audit, readonly]]

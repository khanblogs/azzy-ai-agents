# Rendered by infra/scripts/enable_tls.sh over conf.d/azzy.conf once certificates exist.
# Port 80 then only serves the ACME challenge, a plain health probe, and a redirect.
# Placeholders: azzy.negdtech.in

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript
           application/manifest+json image/svg+xml font/woff2 application/wasm;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Plain-HTTP health probe stays reachable for uptime checks and deploy.sh.
    location = /healthz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        return 301 https://azzy.negdtech.in$request_uri;
    }
}

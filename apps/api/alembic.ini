# Alembic config for AZZY AI AGENTS. `script_location` is package-relative so it works from the
# image (/app) and from a local checkout. DATABASE_URL is injected by azzy/db/migrations/env.py.
[alembic]
script_location = %(here)s/azzy/db/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "azzy-api"
version = "2.0.0"
description = "AZZY AI AGENTS v2.0 API + worker (FastAPI, Redis streams, Postgres/pgvector)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["azzy", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "N", "W"]
ignore = [
  "S101",  # assert in tests
  "S603",  # subprocess without shell=True is exactly what we want
  "S607",  # partial executable paths (ssh, docker) are intentional
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
